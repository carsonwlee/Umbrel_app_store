version: "3.7"

services:
  app_proxy:
    environment:
      # The format here is: <app-id>_<docker-service-name>_1
      APP_HOST: carson-store-bigcapital_proxy_1
      APP_PORT: 80
      # BigCapital has its own signup/login. Umbrel auth would break the SPA/API.
      PROXY_AUTH_ADD: "false"

  proxy:
    image: envoyproxy/envoy:v1.30.11@sha256:b5cc70f5fe5503858817e897ae1da5d873dc32cbc493790b4e330b8a42c4af9d
    restart: on-failure
    init: true
    volumes:
      - ${APP_DATA_DIR}/envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      webapp:
        condition: service_started
      server:
        condition: service_healthy

  webapp:
    # Official bigcapitalhq/webapp is a prebuilt nginx bundle; copying .tsx
    # into it does nothing. This image is v0.25.35 rebuilt with upstream
    # PR 1310 (Generate API Key dialog). Built by
    # .github/workflows/build-bigcapital-webapp.yml — do not use build:.
    image: ghcr.io/carsonwlee/bigcapital-webapp:0.25.35-apikey@sha256:2c2bec3adda44763c458006c814dae99252482d5453f196138c5821c9938e897
    restart: on-failure
    init: true

  server:
    image: bigcapitalhq/server:v0.25.35@sha256:f2d19c378e2fab5c518f29b23559410b5ad9211ecce67d39734f8206fca1b368
    restart: on-failure
    init: true
    # Override the image HEALTHCHECK (/api/system_db). TCP is enough for Envoy
    # to start routing; the image check 404'd on older tags (fixed in v0.24+).
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "require('net').connect({port:3000,host:'127.0.0.1'}).on('connect',function(){this.end();process.exit(0)}).on('error',function(){process.exit(1)})"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    environment:
      DB_HOST: mysql
      DB_USER: bigcapital
      DB_PASSWORD: ${APP_CARSON_STORE_BIGCAPITAL_DB_PASSWORD}
      DB_CHARSET: utf8
      SYSTEM_DB_NAME: bigcapital_system
      TENANT_DB_NAME_PERFIX: bigcapital_tenant_
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_HOST: redis
      QUEUE_PORT: 6379
      JWT_SECRET: ${APP_CARSON_STORE_BIGCAPITAL_JWT_SECRET}
      BASE_URL: http://${DEVICE_DOMAIN_NAME}:${APP_PROXY_PORT}
      SIGNUP_DISABLED: "false"
      SIGNUP_EMAIL_CONFIRMATION: "false"
      HOSTED_ON_BIGCAPITAL_CLOUD: "false"
      BANK_FEED_ENABLED: "false"
      GOTENBERG_URL: http://gotenberg:3000
      GOTENBERG_DOCS_URL: http://server:3000/public/
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_SECURE: "false"
      MAIL_FROM_NAME: BigCapital
      MAIL_FROM_ADDRESS: bigcapital@localhost
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      PLAID_ENV: sandbox
      PLAID_CLIENT_ID: ""
      PLAID_SECRET: ""
      PLAID_LINK_WEBHOOK: ""
      LEMONSQUEEZY_API_KEY: ""
      LEMONSQUEEZY_STORE_ID: ""
      LEMONSQUEEZY_WEBHOOK_SECRET: ""
      S3_REGION: ""
      S3_ACCESS_KEY_ID: ""
      S3_SECRET_ACCESS_KEY: ""
      S3_ENDPOINT: ""
      S3_BUCKET: ""
      STRIPE_PAYMENT_SECRET_KEY: ""
      STRIPE_PAYMENT_PUBLISHABLE_KEY: ""
      STRIPE_PAYMENT_CLIENT_ID: ""
      STRIPE_PAYMENT_WEBHOOKS_SECRET: ""
      STRIPE_PAYMENT_REDIRECT_URL: ""
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      database_migration:
        condition: service_completed_successfully
      tenant_migrate:
        condition: service_completed_successfully
      gotenberg:
        condition: service_started
      mailpit:
        condition: service_started

  database_migration:
    image: bigcapitalhq/server:v0.25.35@sha256:f2d19c378e2fab5c518f29b23559410b5ad9211ecce67d39734f8206fca1b368
    restart: on-failure
    working_dir: /app/packages/server
    command:
      - sh
      - -c
      - node dist/cli.js system:migrate:latest && node dist/cli.js tenants:migrate:latest
    environment:
      DB_HOST: mysql
      DB_USER: bigcapital
      DB_PASSWORD: ${APP_CARSON_STORE_BIGCAPITAL_DB_PASSWORD}
      DB_CHARSET: utf8
      SYSTEM_DB_NAME: bigcapital_system
      TENANT_DB_NAME_PERFIX: bigcapital_tenant_
    depends_on:
      mysql:
        condition: service_healthy

  # Client-only sidecar on the compose network (hostname mysql). Does not use
  # docker.sock or docker exec — the Umbrel web Terminal user is not in the
  # docker group, so the post-start GRANT hook can fail silently.
  tenant_repair:
    image: mariadb:10.11.19@sha256:ce66c7be32a03aabe7241d0a10993a2db827ef652a35d25727d92a832ac8ef73
    restart: on-failure
    environment:
      MYSQL_PWD: ${APP_CARSON_STORE_BIGCAPITAL_DB_ROOT_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        set -eu
        # Do not enable xtrace; never print MYSQL_PWD / the root password.
        mysql_cmd() {
          mysql --host=mysql --protocol=TCP --user=root --batch --skip-column-names --connect-timeout=10 "$@"
        }
        echo "tenant_repair: applying GRANT ALL ON *.* to bigcapital@%"
        mysql_cmd -e "GRANT ALL PRIVILEGES ON *.* TO 'bigcapital'@'%' WITH GRANT OPTION; FLUSH PRIVILEGES;"
        echo "tenant_repair: GRANT applied."
        orgs=""
        if orgs=$$(mysql_cmd -e "SELECT organization_id FROM bigcapital_system.tenants" 2>/dev/null); then
          echo "tenant_repair: read organization_id from tenants"
        elif orgs=$$(mysql_cmd -e 'SELECT `organization_id` FROM `bigcapital_system`.`tenants`' 2>/dev/null); then
          echo "tenant_repair: read quoted organization_id from tenants"
        elif orgs=$$(mysql_cmd -e "SELECT ORGANIZATION_ID FROM bigcapital_system.TENANTS" 2>/dev/null); then
          echo "tenant_repair: read ORGANIZATION_ID from TENANTS"
        elif orgs=$$(mysql_cmd -e 'SELECT `ORGANIZATION_ID` FROM `bigcapital_system`.`TENANTS`' 2>/dev/null); then
          echo "tenant_repair: read quoted ORGANIZATION_ID from TENANTS"
        else
          echo "tenant_repair: tenants table not found or empty; created 0 tenant database(s)."
          exit 0
        fi
        created=0
        for id in $$orgs; do
          if [ -z "$$id" ] || [ "$$id" = "NULL" ]; then
            continue
          fi
          case "$$id" in
            *[!A-Za-z0-9_]*)
              echo "tenant_repair: skip invalid organization_id"
              continue
              ;;
          esac
          db="bigcapital_tenant_$${id}"
          exists=$$(mysql_cmd -e "SELECT SCHEMA_NAME FROM information_schema.SCHEMATA WHERE SCHEMA_NAME='$${db}'") || exists=""
          if [ -n "$$exists" ]; then
            echo "tenant_repair: $${db} already exists"
            continue
          fi
          mysql_cmd -e "CREATE DATABASE IF NOT EXISTS $${db} DEFAULT CHARACTER SET utf8 DEFAULT COLLATE utf8_general_ci"
          created=$$((created + 1))
          echo "tenant_repair: created $${db}"
        done
        echo "tenant_repair: created $${created} tenant database(s)."
        exit 0

  tenant_migrate:
    image: bigcapitalhq/server:v0.25.35@sha256:f2d19c378e2fab5c518f29b23559410b5ad9211ecce67d39734f8206fca1b368
    restart: on-failure
    working_dir: /app/packages/server
    command:
      - sh
      - -c
      - node dist/cli.js tenants:migrate:latest
    environment:
      DB_HOST: mysql
      DB_USER: bigcapital
      DB_PASSWORD: ${APP_CARSON_STORE_BIGCAPITAL_DB_PASSWORD}
      DB_CHARSET: utf8
      SYSTEM_DB_NAME: bigcapital_system
      TENANT_DB_NAME_PERFIX: bigcapital_tenant_
    depends_on:
      mysql:
        condition: service_healthy
      tenant_repair:
        condition: service_completed_successfully

  mysql:
    image: mariadb:10.11.19@sha256:ce66c7be32a03aabe7241d0a10993a2db827ef652a35d25727d92a832ac8ef73
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    environment:
      MYSQL_DATABASE: bigcapital_system
      MYSQL_USER: bigcapital
      MYSQL_PASSWORD: ${APP_CARSON_STORE_BIGCAPITAL_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${APP_CARSON_STORE_BIGCAPITAL_DB_ROOT_PASSWORD}
      MARIADB_AUTO_UPGRADE: "true"
    volumes:
      - ${APP_DATA_DIR}/data/mysql:/var/lib/mysql
      - ${APP_DATA_DIR}/data/mysql-init/grant.sql:/docker-entrypoint-initdb.d/grant.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:6.2.21@sha256:5443f35e8fc8fc8496964b8e8ea39abaf99434d7e1741e514f7f56906b1c9ff0
    user: "1000:1000"
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  gotenberg:
    # Upstream compose exposes 9000; Gotenberg 7 listens on 3000.
    image: gotenberg/gotenberg:7.10.2@sha256:d03b8a04c6e6c5e568b38f57352266dee4674849b71818774025f8f48d869a9a
    restart: on-failure
    init: true

  # Internal SMTP sink so signup/invoice mail does not hit 127.0.0.1:587.
  # UI port 8025 is not published; this is not a separate Umbrel app.
  mailpit:
    image: axllent/mailpit:v1.31.0@sha256:c96991d9bef73594c246d89ca81411d4e916f03e76a7d2d72fa2ab5dd3c9ce24
    restart: on-failure
    init: true
